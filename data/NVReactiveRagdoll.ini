; NV Reactive Ragdoll : reglages. Relus a chaque chargement de partie.
; Journal : NVReactiveRagdoll.log dans le dossier du jeu.

[General]
bEnabled=1
; 1 = une ligne de journal par coup (utile pour regler, a couper ensuite)
bVerbose=1
; le joueur reagit aussi aux coups
bReactPlayer=0

[Debug]
; codes de touches Windows (VK) : 0x77 = F8, 0x76 = F7
; F8 : liste les corps physiques du PNJ sous le viseur dans le journal
iDumpKey=0x77
; F7 : pousse le PNJ sous le viseur (au torse), puis liste ses corps
iPushKey=0x76
fTestPush=150

[Hits]
; impulsion = fBasePush + degats x fPushPerDamage, plafonnee a fMaxPush (unites Havok)
fBasePush=20
fPushPerDamage=1.5
fMaxPush=120
fMeleeMult=1.5
fExplosionMult=2.0
fCriticalMult=1.3
; part de la poussee donnee au parent et aux enfants de l'os touche
fNeighbourShare=0.4
; part verticale de la poussee (0 = a plat)
fUp=0.1

[Death]
; Coup fatal : si le PNJ est encore anime au moment du coup, la poussee attend son ragdoll de mort et part
; alors du meme os, au meme point, dans le meme sens.
bDeferFatalPush=1
; attente maximale (secondes) avant d'abandonner la poussee
fWaitTime=0.6
; multiplicateur de la poussee d'un coup fatal
fPushMult=1.0
; part de la vitesse de course que le corps garde en tombant (mort ou renverse) : 0 = s'arrete net
fCarryVelocity=1.0

[Reactions]
; Chaque coup ajoute sa force a la « charge » du PNJ (fusil a pompe : tous ses plombs). La charge perd la moitie
; de sa valeur toutes les fChargeHalfLife secondes. Selon la charge : tressaille < fStaggerAt <= titube < fKnockdownAt <= tombe.
; Reperes avec les reglages par defaut : 9mm ~40 (tressaille), deux balles rapprochees ~75 (titube),
; fusil de chasse ~90, fusil a pompe de pres ~200 (tombe), masse en attaque puissante ~140 (tombe).
bStagger=1
bKnockdown=1
fStaggerAt=60
fKnockdownAt=140
fChargeHalfLife=0.4
; delai minimal entre deux titubements du meme PNJ (secondes)
fStaggerCooldown=1.5
; force donnee a la chute (comme la commande PushActorAway), multipliee par charge / fKnockdownAt, au plus x fKnockdownForceMaxMult
fKnockdownForce=30
fKnockdownForceMaxMult=2.0
; part de la poussee du coup appliquee a l'os touche une fois le PNJ en ragdoll
fKnockdownLocalPush=0.5

[Muscles]
; Pendant une chute (renverse) ou une mort, le PNJ n'est pas un sac : ses articulations se raidissent et ses
; mains se tendent vers le sol, dans le sens de la chute, pour se rattraper. A la mort, les muscles lachent peu a peu.
bEnabled=1
bOnKnockdown=1
bOnDeath=1
; duree des muscles (secondes) : chute, puis mort
fKnockdownTime=1.5
fDeathTime=0.8
; tension des articulations : part de la rotation relative retiree a chaque image (0 = mou, 0.9 = raide)
fJointTension=0.25
; cou et tete plus raides : la tete ne fouette pas
fNeckTension=0.5
; force du ressort qui tend les mains, son amortissement, et la vitesse maximale ajoutee par image (unites Havok/s)
fArmPull=25
fArmDamping=8
fArmMaxSpeed=4

[RagdollAnim]
; Reglages natifs du jeu (section [RagdollAnim] de Fallout.ini). Seules les lignes non commentees sont ecrites.
; Le journal affiche toutes les valeurs (avant -> apres) au demarrage.
bRagdollFeedback=1
;bRagdollAnim=1
;fPositionGain=
;fVelocityGain=
;fHierarchyGain=
;fAccelerationGain=
;fVelocityDamping=
;fSnapGain=
;uiFeedbackTimeout=
