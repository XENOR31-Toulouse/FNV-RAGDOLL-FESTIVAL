; NV Reactive Ragdoll : reglages (Data\Config\NVReactiveRagdoll.ini).
; Relus a chaque chargement de partie, et des que le fichier change : le menu en jeu (MCM, page « NV Reactive
; Ragdoll », avec MCM Extender) les enregistre a la fermeture du menu pause.
; Journal : NVReactiveRagdoll.log dans le dossier du jeu.

[General]
bEnabled=1
; 0 (par defaut) : les PNJ vivants restent exactement ceux du jeu de base ; tout se joue a leur mort
; (poussee au point touche, muscles, facon de mourir facon Euphoria).
; 1 : les vivants reagissent aussi (tressaillent, titubent, tombent : sections [Reactions], [Fire], [Shock]).
bLivingReactions=0
; 1 = une ligne de journal par coup (utile pour regler, a couper ensuite)
bVerbose=1
; le joueur reagit aussi aux coups
bReactPlayer=0
; reactions au feu, a l'electricite et aux explosions (sections [Fire], [Shock], [Explosions])
bElements=1

[Balance]
; Agonie debout, facon Euphoria, exageree expres. A sa mort (tir a la tete compris), le PNJ ne s'effondre pas :
; il essaie de tenir debout. Ses jambes le portent, il se retient, fait des pas pour se rattraper quand la balle ou
; son elan le desequilibrent, mouline des bras, regarde son tireur, porte la main a sa blessure, encaisse les balles
; suivantes. Il tombe quand il perd vraiment l'equilibre ou que ses forces sont parties, pas a heure fixe ; puis il
; se protege en tombant et se tord au sol.
; Seuls les explosions, le feu, le courant et les degats enormes le jettent directement.
bEnabled=1
; ses forces : duree maximale debout, tiree au hasard entre ces deux valeurs (secondes). Il tombe avant s'il perd
; l'equilibre. Pendant les derniers 30 %, ses jambes faiblissent et ses genoux plient.
fTimeMin=1.5
fTimeMax=3.5
; au-dela de ces degats, il tombe tout de suite (un tir de canon reste un tir de canon)
fMaxDamage=400
; la balle qui tue pousse moins fort : elle le desequilibre (il titube) au lieu de le jeter
fPushMult=0.6
; chaque balle encaissee pendant l'agonie lui retire cette part du temps qui lui restait
fHitWeaken=0.35
; force qui reste a une jambe ou un bras touche (la jambe flanche, le bras pend)
fWoundedLimb=0.3
; une balle dans le tronc lui plie le dos pendant ... secondes
fFlinchTime=0.25
; il tourne la tete vers celui qui lui tire dessus (0 = non ; pas apres une balle dans la tete)
fHeadLook=1.0
; amplitude du balancement du tronc, et force des bras qui s'ecartent et moulinent pour l'equilibre
fSway=0.2
fArms=0.6
; creatures seulement (elles n'ont pas le modele de jambes) : part de leur poids portee pendant l'agonie
fSupport=0.6

; Muscles d'articulation (comme Euphoria) : au moment de la mort, la pose debout du PNJ est photographiee ; chaque
; articulation est ensuite un muscle qui ramene l'os vers sa place dans cette pose.
bJointMuscles=1
; force et amortissement des muscles (par seconde), et vitesse maximale ajoutee par image (rad/s)
fJointStrength=30
fJointDamping=6
fJointMaxSpeed=8
; force relative des jambes, du dos, des bras et du cou
fLegStrength=1.5
fSpineStrength=1.0
fArmStrength=0.3
fNeckStrength=0.6
; la jambe qui fait un pas est relachee (part de sa force gardee)
fStepLegRelax=0.3
; part de la pose gardee pendant la chute (il ne tombe pas comme un sac)
fFallPose=0.25

[Stand]
; Equilibre des humains (reglages fins). Tout est sans unite : les longueurs en « hauteur de bassin », les temps en
; « temps de chute naturel du corps » (racine de hauteur / gravite, environ 0,3 s). Ca vaut donc pour toutes les
; tailles de PNJ.
; Jambes : un ressort entre les pieds poses et le bassin porte le corps et pousse les pieds contre le sol avec la
; meme force. Raideur, amortissement (8 = sans rebond pour une raideur de 16), force maximale en poids du corps.
fLegStiffness=16
fLegDamping=8
fLegMaxForce=2.5
; part de sa hauteur qu'il perd quand ses forces s'en vont (genoux qui plient)
fSag=0.4
; il se retient au-dessus de ses pieds, au plus avec cette force (en poids du corps : l'adherence de ses pieds).
; Plus bas = il fait des pas plus vite ; plus haut = il encaisse sur place.
fGrip=0.35
fHoldGain=2.0
fHoldDamping=1.5
; rappel du tronc vers la verticale
fUpright=2.0
; les pas : duree d'un pas, anticipation (1 = le pied va exactement la ou il faut pour s'arreter), hauteur du pied,
; et rayon de la zone autour de ses pieds ou il n'a pas besoin de faire un pas
fStepTime=1.1
fStepLead=1.0
fStepLift=0.12
fStepZone=0.12
; il a perdu l'equilibre : dos penche de plus de ... degres, ou bassin plus bas que cette part de sa hauteur
fMaxTilt=60
fMinHeight=0.45

[Debug]
; codes de touches Windows (VK) : 0x77 = F8, 0x76 = F7
; F8 : liste les corps physiques du PNJ sous le viseur dans le journal
iDumpKey=0x77
; F7 : pousse le PNJ sous le viseur (au torse), puis liste ses corps
iPushKey=0x76
fTestPush=150

[Hits]
; impulsion = fBasePush + degats x fPushPerDamage, plafonnee a fMaxPush (unites Havok)
fBasePush=20
fPushPerDamage=1.5
fMaxPush=120
fMeleeMult=1.5
fExplosionMult=2.0
fCriticalMult=1.3
; part de la poussee donnee au parent et aux enfants de l'os touche
fNeighbourShare=0.4
; part verticale de la poussee (0 = a plat)
fUp=0.1

[Death]
; Coup fatal : la poussee attend le ragdoll de mort et part alors du meme os, au meme point, dans le meme sens.
; Chaque coup prepare sa poussee ; elle ne sert que si le PNJ est mort quand son ragdoll demarre.
bDeferFatalPush=1
; attente maximale (secondes) entre le coup et le debut du ragdoll de mort
fWaitTime=1.0
; multiplicateur de la poussee d'un coup fatal (morts exagerees : 1.5)
fPushMult=1.5
; part de la vitesse de course que le corps garde en tombant (mort ou renverse) : 0 = s'arrete net
fCarryVelocity=1.0
; Poussee que le jeu donne lui-meme aux corps touches, dont la « kill impulse » de chaque arme (toujours au centre
; du corps). 1 = jeu de base ; 0.5 comme le mod Ragdolls, pour laisser la place a notre poussee au point touche.
; Ligne commentee = le jeu garde sa valeur.
fVanillaImpulseMult=0.5

; Main sur la plaie : une main va sur l'endroit touche (la tete pour un tir a la tete) et le suit, debout comme
; pendant la chute ; la main du cote oppose si c'est un bras qui est touche. Pas pour les explosions.
bGrabWound=1
fGrabChance=0.7
; force de la main qui va sur la plaie, par rapport aux bras qui se protegent
fGrabPull=1.5

; Tir a la tete : 0 (par defaut) = agonie debout comme les autres morts, la tete ballotte ; 1 = s'effondre net.
bHeadshotLimp=0

; Se tord au sol : une fois tombe, il bouge encore quelques secondes, mains vers le ventre, jambes qui se
; replient, de plus en plus faiblement. Pas pour les explosions, ni au-dela de fWritheMaxDamage.
bWrithe=1
fWritheChance=0.6
fWritheTime=3
; nouveau geste toutes les fWritheTimer s ; force des muscles au sol et des gestes
fWritheTimer=0.7
fWritheStrength=0.35
fWrithePull=0.5
fWritheMaxDamage=400

[Reactions]
; Seulement si [General] bLivingReactions=1.
; Chaque coup ajoute sa force a la « charge » du PNJ (fusil a pompe : tous ses plombs). La charge perd la moitie
; de sa valeur toutes les fChargeHalfLife secondes. Selon la charge : tressaille < fStaggerAt <= titube < fKnockdownAt <= tombe.
; Reperes avec les reglages par defaut : 9mm ~40 (tressaille), deux balles rapprochees ~75 (titube),
; fusil de chasse ~90, fusil a pompe de pres ~200 (tombe), masse en attaque puissante ~140 (tombe).
bStagger=1
bKnockdown=1
fStaggerAt=60
fKnockdownAt=140
fChargeHalfLife=0.4
; delai minimal entre deux titubements du meme PNJ (secondes)
fStaggerCooldown=1.5
; force donnee a la chute (comme la commande PushActorAway), multipliee par charge / fKnockdownAt, au plus x fKnockdownForceMaxMult
fKnockdownForce=30
fKnockdownForceMaxMult=2.0
; part de la poussee du coup appliquee a l'os touche une fois le PNJ en ragdoll
fKnockdownLocalPush=0.5

[Muscles]
; Pendant une chute (renverse) ou une mort, le PNJ n'est pas un sac : ses articulations se raidissent et ses
; mains se tendent vers le sol, dans le sens de la chute, pour se rattraper. A la mort, les muscles lachent peu a peu.
bEnabled=1
bOnKnockdown=1
bOnDeath=1
; duree des muscles (secondes) : chute d'un vivant, puis chute d'un mourant (ecourtee des qu'il est au sol)
fKnockdownTime=1.5
fDeathTime=1.5
; tension des articulations : part de la rotation relative retiree a chaque image (0 = mou, 0.9 = raide)
fJointTension=0.25
; cou et tete plus raides : la tete ne fouette pas
fNeckTension=0.5
; force du ressort qui tend les mains, son amortissement, et la vitesse maximale ajoutee par image (unites Havok/s)
fArmPull=25
fArmDamping=8
fArmMaxSpeed=4

; L'element d'un coup est reconnu sans liste d'armes : par la resistance de l'arme (feu ; electricite ou IEM),
; ou par son projectile (flamme : lance-flammes, incinerateur). Le premier coup de feu ou de courant fait tituber.

[Fire]
; vivant : en feu pendant fBurnTime s apres le dernier coup ; si son corps est physique, ses mains battent
fBurnTime=2.5
fLivingFlail=15
; mort ou chute dans le feu : bras qui tapent les flammes et jambes qui donnent des coups pendant fDeathTime s
fDeathTime=2.5
; toutes les fFlailTimer s, les mains changent de cible et les jambes donnent un coup
fFlailTimer=0.3
; force des bras (par rapport au reflexe de protection) et vitesse de rotation des coups de jambe (rad/s)
fArmPull=1.2
fLegKick=6

[Shock]
; vivant : electrocute pendant fShockTime s ; son torse, sa tete et ses bras tremblent si son corps est physique
fShockTime=1.5
fLivingShake=8
; mort ou chute : chaque os tremble (rad/s par image, a 60 images/s), muscles contractes
fShake=1.5

[Explosions]
; part verticale de la poussee d'une explosion (au lieu de [Hits] fUp)
fUp=0.5
; une explosion renverse plus fort
fKnockdownMult=1.5
; projete : pendant fFlyTime s, tant qu'il vole a plus de fFlyMinSpeed (unites Havok/s), ses bras tournent en
; moulinet et ses jambes pedalent, a fWindmillSpeed rad/s ; ensuite il tend les mains pour se rattraper
fFlyTime=1.2
fFlyMinSpeed=3
fWindmillSpeed=8

[Creatures]
; Les creatures reagissent comme les PNJ, sur leur propre squelette : le torse est leur corps le plus lourd, leurs
; membres sont trouves par la forme du squelette (pas de liste a tenir). Main sur la plaie : humanoides seulement.
; Le journal decrit une fois le squelette de chaque type de creature touchee.
bEnabled=1
bStagger=1
bKnockdown=1
bMuscles=1
; seuils de titubement et de chute multiplies par la racine de (masse de la creature / masse d'un humain),
; entre 0,5 et 3 : un deathclaw tient mieux debout qu'un rat-taupe. Vaut aussi pour les PNJ (super mutants...).
bMassScaling=1
; multiplicateur supplementaire des seuils pour les creatures
fThresholdMult=1.0

[Compatibility]
; Explosion Reactions (animations sur les vivants touches par une explosion) : s'il est actif, on lui laisse les
; vivants touches par une explosion (pas de titubement ni de chute de notre part ; la mort reste a nous).
bYieldToExplosionReactions=1

[RagdollAnim]
; Reglages natifs du jeu (section [RagdollAnim] de Fallout.ini). Seules les lignes non commentees sont ecrites.
; Le journal affiche toutes les valeurs (avant -> apres) au demarrage.
; bRagdollFeedback : rend le corps des vivants physique quand ils sont touches (utile seulement avec
; bLivingReactions=1). Laisse commente, le jeu garde sa valeur.
;bRagdollFeedback=1
;bRagdollAnim=1
;fPositionGain=
;fVelocityGain=
;fHierarchyGain=
;fAccelerationGain=
;fVelocityDamping=
;fSnapGain=
;uiFeedbackTimeout=
